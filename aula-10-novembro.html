let ddlState = { created: false, locked: false };
function runDDLDemo(idx, action) {
  const out = document.getElementById(`demo-output-${idx}`);
  if (action === 'create') {
    ddlState.created = true;
    out.innerHTML = `Query OK. Usuário 'analista'@'%' criado no sistema MySQL.`;
  } else if (action === 'lock') {
    if (!ddlState.created) { out.innerHTML = `⚠️ Crie a conta primeiro.`; return; }
    ddlState.locked = true;
    out.innerHTML = `Query OK. Status da conta atualizado para: ACCOUNT LOCK (Bloqueada).`;
  } else if (action === 'login') {
    if (!ddlState.created) { out.innerHTML = `⚠️ Conta não existe.`; return; }
    if (ddlState.locked) {
      out.innerHTML = `<span style="color:var(--danger);">❌ ERROR 3118 (HY000): Access denied for user 'analista'@'%'. Account is locked. (Exemplo Real: Bloqueio de segurança no Banco do Brasil).</span>`;
    } else {
      out.innerHTML = `<span style="color:var(--success);">✅ Login efetuado com sucesso!</span>`;
    }
  } else if (action === 'unlock') {
    if (!ddlState.created) { out.innerHTML = `⚠️ Crie a conta primeiro.`; return; }
    ddlState.locked = false;
    out.innerHTML = `Query OK. Conta desbloqueada (ACCOUNT UNLOCK).`;
  }
}

// QUIZ LOGIC WITH RETRY & XP
function checkAnswer(btn, tabIdx, qIdx) {
  const isCorrect = btn.getAttribute("data-correct") === "true";
  const feedbackText = btn.getAttribute("data-fb");
  const fbContainer = document.getElementById(`fb-${tabIdx}-${qIdx}`);
  const parentQ = document.getElementById(`q-${tabIdx}-${qIdx}`);
  const allOpts = parentQ.querySelectorAll(".quiz-opt");

  if (isCorrect) {
    btn.classList.add("correct");
    fbContainer.className = "feedback-box show-correct";
    fbContainer.innerHTML = `✅ <strong>Por que esta está certa:</strong> ${feedbackText}`;

    // Lock all options for this question
    allOpts.forEach(opt => opt.disabled = true);

    // Award XP
    const hasErr = parentQ.getAttribute("data-has-error") === "true";
    addXP(hasErr ? 5 : 10);
  } else {
    btn.classList.add("wrong");
    btn.disabled = true;
    parentQ.setAttribute("data-has-error", "true");
    fbContainer.className = "feedback-box show-wrong";
    fbContainer.innerHTML = `❌ <strong>Por que esta está errada:</strong> ${feedbackText}`;
  }
}

function addXP(amount) {
  currentXP += amount;
  document.getElementById("xp-display").innerText = `⭐ XP: ${currentXP}`;
}

// TAB ACTIVATION & ROUTING
function activateTab(index) {
  const tabs = document.querySelectorAll(".tab-btn");
  const panels = document.querySelectorAll(".tab-panel");

  tabs.forEach((tab, i) => {
    if (i === index) {
      tab.classList.add("active");
      tab.setAttribute("aria-selected", "true");
    } else {
      tab.classList.remove("active");
      tab.setAttribute("aria-selected", "false");
    }
  });

  panels.forEach((panel, i) => {
    if (i === index) {
      panel.classList.add("active");
    } else {
      panel.classList.remove("active");
    }
  });

  location.hash = `aba-${index + 1}`;
}

function setupRouting() {
  window.addEventListener("hashchange", parseHash);
  parseHash();
}

function parseHash() {
  const hash = location.hash;
  if (hash.startsWith("#aba-")) {
    const num = parseInt(hash.replace("#aba-", ""), 10) - 1;
    if (num >= 0 && num <= AULA_DADOS.length) {
      activateTab(num);
      return;
    }
  }
  activateTab(0);
}

// KEYBOARD NAVIGATION
function setupKeyboardNav() {
  document.addEventListener("keydown", (e) => {
    const activeTabObj = document.querySelector(".tab-btn.active");
    if (!activeTabObj) return;

    const allTabs = Array.from(document.querySelectorAll(".tab-btn"));
    let currIdx = allTabs.indexOf(activeTabObj);

    if (e.key === "ArrowRight") {
      let next = (currIdx + 1) % allTabs.length;
      activateTab(next);
    } else if (e.key === "ArrowLeft") {
      let prev = (currIdx - 1 + allTabs.length) % allTabs.length;
      activateTab(prev);
    }
  });
}

  document.body.classList.toggle("dark-mode", isDarkMode);
  document.getElementById("btn-toggle-dark").innerText = isDarkMode ? "☀️ Modo Claro" : "🌙 Modo Escuro";
}

function togglePresentationMode() {
  isPresentationMode = !isPresentationMode;
  document.body.classList.toggle("presentation-mode", isPresentationMode);
  document.getElementById("btn-toggle-mode").innerText = isPresentationMode ? "📖 Modo Leitura" : "🎤 Modo Apresentação";
}
</script>

</body>
